name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - custom_components/solar_window/manifest.json
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: solar-window-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate version
        id: version
        shell: bash
        run: |
          MANIFEST_VERSION=$(jq -r '.version' custom_components/solar_window/manifest.json)
          RELEASE_TAG="v${MANIFEST_VERSION}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "${RELEASE_TAG}" ]]; then
            echo "Tag and manifest versions do not match."
            exit 1
          fi
          echo "tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "Release version: ${RELEASE_TAG}"

      - name: Run tests
        run: |
          python -m unittest discover -s tests -v
          node --test tests/*.test.js

      - name: Create integration ZIP
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: python scripts/build_release_zip.py --version "$RELEASE_TAG" --output solar_window.zip

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "${RELEASE_TAG}" > /dev/null 2>&1; then
            if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_TYPE}" != "tag" ]]; then
              echo "Release already exists; leaving the published version untouched."
              exit 0
            fi
            echo "Release already exists, uploading asset..."
            gh release upload "${RELEASE_TAG}" solar_window.zip --clobber
          else
            RELEASE_FLAGS=()
            if [[ "${RELEASE_TAG}" == *-* ]]; then
              RELEASE_FLAGS+=(--prerelease)
            fi
            gh release create "${RELEASE_TAG}" solar_window.zip \
              --target "${GITHUB_SHA}" \
              --title "${RELEASE_TAG}" \
              --generate-notes \
              "${RELEASE_FLAGS[@]}"
          fi
